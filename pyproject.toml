[project]
name = "cayzn"
version = "0.1.0"
description = "CAYZN API"
readme = "README.md"
authors = [
    { name = "Abry Maxime", email = "github@abmx.fr" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.159.1",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
