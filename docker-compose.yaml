services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cayzn
      POSTGRES_PASSWORD: cayzn
      POSTGRES_DB: cayzn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cayzn"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
