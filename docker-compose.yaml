x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql+psycopg://cayzn:cayzn@db:5432/cayzn
    REDIS_URL: redis://redis:6379/0

services:
  api:
    <<: *app
    command: uvicorn cayzn.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      worker:
        condition: service_completed_successfully

  # One-shot: applies the migrations, imports the transport plan, reloads the
  # cache, requests the runs (`just worker` processes them).
  worker:
    <<: *app
    command: sh -c "alembic upgrade head && python -m cayzn.importer files && python -m cayzn.worker request-all"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cayzn
      POSTGRES_PASSWORD: cayzn
      POSTGRES_DB: cayzn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cayzn"]
      interval: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
